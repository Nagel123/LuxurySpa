<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE SPA | Modern Wellness</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">LUXE SPA</div>
        <div class="nav-links">
            <a href="#services">Treatments</a>
            <a href="#booking" class="btn-outline">Book Now</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-overlay">
            <h1>Reclaim Your Calm</h1>
            <p>Modern sanctuary for the refined soul.</p>
            <a href="#booking" class="btn-primary">Reserve Experience</a>
        </div>
    </section>

    <section id="booking" class="booking-section">
        <div class="container">
            <h2>Online Reservation</h2>
            <p>Select your treatment and preferred time below.</p>
            <!-- Formspree Integration -->
            <form action="https://formspree.io" method="POST" class="booking-form">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Full Name" required>
                    <input type="email" name="email" placeholder="Email Address" required>
                </div>
                <div class="form-group">
                    <select name="service" required>
                        <option value="" disabled selected>Select Treatment</option>
                        <option value="Aromatherapy">Aromatherapy Massage</option>
                        <option value="Deep Tissue">Deep Tissue Massage</option>
                        <option value="Advanced Facial">Advanced Radiant Facial</option>
                    </select>
                    <input type="date" name="date" required>
                </div>
                <textarea name="message" placeholder="Special requests or preferences..."></textarea>
                <!-- Honeypot to prevent spam -->
                <input type="text" name="_gotcha" style="display:none">
                <button type="submit" class="btn-primary">Confirm Request</button>
            </form>
        </div>
    </section>
</body>
</html>
