<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE ZENITH | #1 World-Class Luxury Spa</title>
    <!-- Modern Fonts -->
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Smooth Scroll Wrapper -->
    <div id="smooth-wrapper">
        <div id="smooth-content">
            
            <nav class="glass-nav">
                <div class="logo">ZENITH</div>
                <div class="social-nav">
                    <!-- Instagram-style Circular Button -->
                    <div class="about-circle" id="about-btn">
                        <img src="https://images.unsplash.com" alt="About">
                        <span>About</span>
                    </div>
                    <!-- Facebook-style Pill Button -->
                    <a href="#booking" class="fb-contact-btn">Contact Us</a>
                </div>
            </nav>

            <header class="hero">
                <div class="flying-content">
                    <h1 class="reveal">Eternal Elegance</h1>
                    <p class="reveal">The World's Most Exclusive Wellness Sanctuary</p>
                    <div class="hero-btns reveal">
                        <a href="#booking" class="btn-main">Begin Journey</a>
                    </div>
                </div>
            </header>

            <section class="booking-section" id="booking">
                <div class="booking-card reveal">
                    <h2>Priority Reservation</h2>
                    <form action="https://formspree.io" method="POST">
                        <input type="text" name="name" placeholder="Name" required>
                        <input type="email" name="email" placeholder="Email" required>
                        <select name="service">
                            <option>Royal Thai Massage</option>
                            <option>Golden Leaf Facial</option>
                        </select>
                        <button type="submit">Request Access</button>
                    </form>
                </div>
            </section>

        </div>
    </div>

    <!-- GSAP & Smooth Scroll Scripts -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <script src="https://cdnjs.cloudflare.com"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Flying Entrance Animation
        gsap.from(".reveal", {
            duration: 1.5,
            y: 100,
            opacity: 0,
            stagger: 0.3,
            ease: "power4.out"
        });

        // Scroll-triggered flying effect for sections
        gsap.from(".booking-card", {
            scrollTrigger: {
                trigger: ".booking-card",
                start: "top 80%",
                scrub: 1
            },
            scale: 0.8,
            opacity: 0,
            y: 50
        });
    </script>
</body>
</html>
